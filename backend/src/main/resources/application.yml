server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/crm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  # 扫描 mapper XML
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 数据库下划线列名自动映射成 Java 驼峰属性：parent_id -> parentId
    map-underscore-to-camel-case: true

logging:
  level:
    com.demo.crm.mapper: debug   # 打印 SQL，方便调试
